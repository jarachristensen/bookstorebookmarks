<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 900" width="100%" height="100%">
        <rect width="320" height="900" fill="#FAF7EE" rx="4" />
        <rect x="12" y="12" width="296" height="876" fill="none" stroke="#15803D" stroke-width="2" rx="2" />
        <rect x="18" y="18" width="284" height="864" fill="none" stroke="#84CC16" stroke-width="0.75" rx="2" />
        
        <!-- Apple & Leaf Motif -->
        <g transform="translate(160, 90)">
          <circle cx="0" cy="0" r="32" fill="#15803D" />
          <!-- Apple Shape -->
          <path d="M -16 -8 C -22 -20 -4 -25 0 -14 C 4 -25 22 -20 16 -8 C 22 10 10 24 0 24 C -10 24 -22 10 -16 -8 Z" fill="#4ADE80" />
          <!-- Apple Stem & Leaf -->
          <path d="M 0 -14 Q 4 -26 12 -22 Q 10 -16 2 -14 Z" fill="#FEF08A" />
        </g>
        
        <!-- Storefront Woodcut Block -->
        <g transform="translate(45, 150)">
          <rect width="230" height="230" fill="#F0FDF4" stroke="#15803D" stroke-width="2" />
          <rect x="20" y="30" width="190" height="40" fill="#15803D" rx="3" />
          <text x="115" y="55" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="bold" fill="#FEF08A" text-anchor="middle" letter-spacing="2">GREEN APPLE BOOKS</text>
          <!-- Windows & Bookstalls -->
          <rect x="25" y="85" width="80" height="120" fill="#FAF7EE" stroke="#15803D" stroke-width="1.5" />
          <line x1="25" y1="125" x2="105" y2="125" stroke="#15803D" />
          <line x1="25" y1="165" x2="105" y2="165" stroke="#15803D" />
          <rect x="32" y="95" width="12" height="30" fill="#15803D" />
          <rect x="46" y="100" width="10" height="25" fill="#84CC16" />
          <rect x="58" y="90" width="14" height="35" fill="#166534" />
          <rect x="74" y="102" width="12" height="23" fill="#A3E635" />
          <!-- Green Door -->
          <rect x="125" y="85" width="80" height="140" fill="#166534" />
          <rect x="135" y="95" width="60" height="60" fill="#DCFCE7" opacity="0.6" />
        </g>
        
        <text x="160" y="425" font-family="'EB Garamond', Georgia, serif" font-size="24" font-weight="bold" fill="#14532D" text-anchor="middle" letter-spacing="1.5">GREEN APPLE</text>
        <text x="160" y="455" font-family="'EB Garamond', Georgia, serif" font-size="20" font-style="italic" fill="#15803D" text-anchor="middle">BOOKS</text>
        
        <line x1="60" y1="475" x2="260" y2="475" stroke="#15803D" stroke-width="1" />
        
        <text x="160" y="510" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1C1917" text-anchor="middle" letter-spacing="2">506 CLEMENT STREET</text>
        <text x="160" y="535" font-family="sans-serif" font-size="11" fill="#78716C" text-anchor="middle" letter-spacing="2">SAN FRANCISCO · INNER RICHMOND</text>
        
        <!-- Motto Box -->
        <rect x="35" y="570" width="250" height="120" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" rx="4" />
        <text x="160" y="600" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#15803D" text-anchor="middle">“A San Francisco Landmark</text>
        <text x="160" y="622" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#15803D" text-anchor="middle">for Book Lovers Since 1967”</text>
        <line x1="100" y1="640" x2="220" y2="640" stroke="#86EFAC" stroke-width="0.75" />
        <text x="160" y="665" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">USED · RARE · NEW BOOKS</text>
        
        <!-- Bottom Accession -->
        <rect x="35" y="780" width="250" height="70" fill="#F0FDF4" rx="4" stroke="#86EFAC" stroke-width="1" />
        <text x="160" y="805" font-family="monospace" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle" letter-spacing="1.5">CATALOG: BM-1967-SF-04</text>
        <text x="160" y="825" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#78716C" text-anchor="middle">Founded 1967 by Richard Savoy</text>
        <text x="160" y="842" font-family="sans-serif" font-size="9" fill="#84CC16" text-anchor="middle">PUBLISHERS WEEKLY BOOKSTORE OF THE YEAR</text>
      </svg>