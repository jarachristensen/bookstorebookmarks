<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 900" width="100%" height="100%">
        <rect width="320" height="900" fill="#FAF7EE" rx="4" />
        <rect x="16" y="16" width="288" height="868" fill="none" stroke="#BBF7D0" stroke-width="1" rx="2" />
        
        <text x="160" y="65" font-family="'EB Garamond', Georgia, serif" font-size="15" font-weight="bold" fill="#14532D" text-anchor="middle" letter-spacing="1">THE CLEMENT STREET LABYRINTH</text>
        <line x1="60" y1="80" x2="260" y2="80" stroke="#15803D" stroke-width="1" />
        
        <g transform="translate(35, 115)">
          <text x="0" y="0" font-family="Georgia, serif" font-size="13" fill="#1C1917" line-height="1.6">
            <tspan x="0" dy="0">“Started with a $1,000 bond and used</tspan>
            <tspan x="0" dy="24">books gathered from flea markets, Green</tspan>
            <tspan x="0" dy="24">Apple grew into two stories of creaking</tspan>
            <tspan x="0" dy="24">floors, hidden nooks, and over 100,000</tspan>
            <tspan x="0" dy="24">titles in San Francisco's Richmond.”</tspan>
          </text>
        </g>
        
        <rect x="35" y="270" width="250" height="340" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" rx="4" />
        <text x="160" y="300" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle" letter-spacing="1">DEPARTMENTS &amp; SECTIONS</text>
        <line x1="60" y1="315" x2="260" y2="315" stroke="#BBF7D0" stroke-width="0.75" />
        
        <text x="50" y="350" font-family="Georgia, serif" font-size="12" fill="#166534">✦ Used &amp; Rare Antiquarian</text>
        <text x="50" y="385" font-family="Georgia, serif" font-size="12" fill="#166534">✦ Contemporary Fiction &amp; Poetry</text>
        <text x="50" y="420" font-family="Georgia, serif" font-size="12" fill="#166534">✦ San Francisco &amp; Bay Area History</text>
        <text x="50" y="455" font-family="Georgia, serif" font-size="12" fill="#166534">✦ Graphic Novels &amp; Comix</text>
        <text x="50" y="490" font-family="Georgia, serif" font-size="12" fill="#166534">✦ Science Fiction &amp; Fantasy</text>
        <text x="50" y="525" font-family="Georgia, serif" font-size="12" fill="#166534">✦ Philosophy, Art &amp; Film</text>
        <text x="50" y="560" font-family="Georgia, serif" font-size="12" fill="#166534">✦ Vinyl Records &amp; Audiobooks</text>
        
        <rect x="35" y="650" width="250" height="180" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" rx="4" />
        <text x="160" y="685" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803D" text-anchor="middle">COMMUNITY BOOKSELLING EXCELLENCE</text>
        <text x="160" y="715" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#78716C" text-anchor="middle">Voted Best Used Bookstore</text>
        <text x="160" y="735" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#78716C" text-anchor="middle">in the Bay Guardian &amp; SF Weekly</text>
        <text x="160" y="755" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#78716C" text-anchor="middle">every year since 1989.</text>
        <text x="160" y="795" font-family="monospace" font-size="9" fill="#15803D" text-anchor="middle">506 CLEMENT ST · SAN FRANCISCO, CA</text>
      </svg>