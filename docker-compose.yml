version: "3.8"

services:
  bookstore-bookmarks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore-bookmarks
    restart: unless-stopped
    ports:
      - "7715:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/archive.db
      - ADMIN_PASSPHRASE=curator123
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
